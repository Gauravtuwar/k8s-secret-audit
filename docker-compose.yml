version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: k8s_audit_postgres
    restart: always
    environment:
      POSTGRES_DB: k8s_audit_db
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: secure_audit_password_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit_user -d k8s_audit_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: k8s_audit_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://audit_user:secure_audit_password_change_me@postgres:5432/k8s_audit_db
      SECRET_KEY: super-secret-key-change-this-in-production-32bytes-min!
      CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: k8s_audit_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  postgres_data:
